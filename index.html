        /* ========== CRITICAL CSS OPTIMIZED ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0f1e, #02050c);

            justify-content: center;
            align-items: center;

        }

        /* Smooth scrolling & subtle animation */

        }

        .wrapper {
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.7rem;
            position: relative;
            z-index: 2;
        }

        /* Animated glow badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(20, 25, 45, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 75, 75, 0.5);
            padding: 0.65rem 1.4rem;
            border-radius: 80px;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
            color: #fff0e6;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            text-align: center;
        }

        .badge span {
            font-size: 1.2rem;
        }

        .heading {
            font-size: 1.65rem;
            font-weight: 800;
            line-height: 1.3;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
        }

        .gradient-text {
            background: linear-gradient(125deg, #ff5e7c, #ff9966);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            position: relative;
        }

        /* Video Card Styling (high performance) */
        .video-card {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 100, 100, 0.2);
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1), box-shadow 0.3s;
            background: #0b0e17;
        }

        .video-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 28px 45px -12px rgba(255, 65, 108, 0.35), 0 0 0 2px rgba(255, 80, 120, 0.5);
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .video-card:hover img {
            transform: scale(1.03);
        }

        /* Play Overlay with enhanced pulse effect */
        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #ff2b4d, #ff6a3c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 55, 85, 0.8);
            transition: all 0.25s ease;
            backdrop-filter: blur(2px);
            animation: subtle-pulse 2.2s infinite;
        }

        @keyframes subtle-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 65, 108, 0.6);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(255, 65, 108, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 65, 108, 0);
            }
        }

        .play-icon {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 22px solid #ffffff;
            margin-left: 6px;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }

        .video-card:hover .play-overlay {
            transform: translate(-50%, -50%) scale(1.08);
            background: linear-gradient(135deg, #ff1f44, #ff5722);
        }

        /* Modern CTA Button */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 290px;
            padding: 1rem 1.8rem;
            background: linear-gradient(95deg, #FF0040, #FF7A00);
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.08rem;
            color: white;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            box-shadow: 0 12px 25px -5px rgba(255, 30, 86, 0.5);
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .cta-btn:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 20px 35px -8px rgba(255, 40, 80, 0.7);
            background: linear-gradient(95deg, #FF2E5E, #FF8C42);
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        /* Micro interaction for ripple - added class for UX */
        .ripple-effect {
            position: relative;
            overflow: hidden;
        }

        /* Bottom trust badge / extra SEO signal */

            text-align: center;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            color: #b9c3db;

        .trust-meta span {
            display: inline-flex;
            align-items: center;
            gap: 5px;

        /* Responsive touches */

            body {
                padding: 1rem;
            }
            .heading {
                font-size: 1.35rem;
            }
            .badge {
                font-size: 0.75rem;

            }
            .play-icon {
                border-top: 9px solid transparent;
                border-bottom: 9px solid transparent;
                border-left: 17px solid white;
            }
            .cta-btn {
                padding: 0.85rem 1.5rem;
                font-size: 1rem;
            }
        }

        /* lazy load effect - but image already preloaded */
        @media (prefers-reduced-motion: reduce) {
            .video-card, .cta-btn, .play-overlay {
                transition: none;
                animation: none;
            }
        }

        /* additional accessibility focus styles */
        a:focus-visible, .video-card:focus-visible {
            outline: 3px solid #ff6a6a;
            outline-offset: 4px;
            border-radius: 24px;
        }
